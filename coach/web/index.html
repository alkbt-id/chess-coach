<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- iPad (coach/lan.py): opened from the Home Screen as an app, without Safari's bar. The page runs under the
     status bar (black-translucent + viewport-fit=cover) and pads its header by env(safe-area-inset-top):
     otherwise iPadOS 26+ lays a frosted band over the top of the app and the header under it looks blurred.
     iOS reads the status-bar style when the icon is added: after changing it, re-add the icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/favicon.png">
<title>Шахматный тренер</title>
<link rel="stylesheet" href="/static/vendor/chessground.base.css">
<link rel="stylesheet" href="/static/vendor/board.lichess-brown.css">
<link rel="stylesheet" href="/static/vendor/pieces.merida.css">
<!-- ?v=: the iPad keeps static files cached; bump it (here and on app.js below) when app.css or app.js changes -->
<link rel="stylesheet" href="/static/app.css?v=32">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="modes" role="tablist" aria-label="Режим">
      <button type="button" class="mode" role="tab" data-mode="study" aria-selected="false">Разбор</button>
      <button type="button" class="mode" role="tab" data-mode="rep" aria-selected="false" title="Мой дебютный репертуар: разделы, уроки с Claude, тренировка по памяти">Репертуар <small class="badge" id="rep-count" title="Позиций пора повторить"></small></button>
      <button type="button" class="mode" role="tab" data-mode="puzzle" aria-selected="false">Задачи <small class="badge" id="due-count" title="Задач пора повторить"></small></button>
      <button type="button" class="mode" role="tab" data-mode="play" aria-selected="false" title="Партии на Lichess">Игра <small class="badge live-dot" id="play-count" title="Идёт партия"></small></button>
    </div>
    <div class="top-right">
      <div class="status" id="status" aria-live="polite"></div>
      <!-- shown only while something runs (or just ended); the jobs themselves are in the ⋯ menu -->
      <button type="button" class="job-chip" id="job-chip" hidden title="Обработка партий: журнал и «остановить»"><span class="spin"></span><span id="job-text"></span></button>
      <button type="button" class="tbtn" id="chat-toggle" title="Показать или скрыть чат с Claude"><svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg>Claude</button>
      <button type="button" class="ibtn" id="app-menu-btn" aria-label="Меню: партии с Lichess, отчёт по ошибкам" title="Партии с Lichess, отчёт по ошибкам"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </div>
  </header>

  <main class="layout" id="layout">
    <aside class="chat" id="chat">
      <div class="chat-head" id="chat-head"></div>
      <div class="chat-log" id="chat-log"></div>
      <form class="chat-input" id="chat-form">
        <textarea id="chat-text" rows="1" placeholder="Спроси Claude про позицию, партию или задачу…"></textarea>
        <div class="chat-row">
          <button type="button" class="chip-sel" id="chat-model-btn" hidden title="Модель, сколько думать; удалить чат"><span id="chat-model-text"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
          <label class="switch" id="ask-switch" title="Твой ход на доске чата или в позиции из задачи — вопрос Claude про этот ход"><input type="checkbox" id="auto-ask"><span class="sw" aria-hidden="true"></span><span>Разбирать мои ходы</span></label>
          <button class="btn primary" id="chat-send" type="submit">Отправить</button>
        </div>
      </form>
    </aside>
    <div class="gutter" id="g2" title="Тяни, чтобы поменять ширину · двойной клик — авто"></div>
    <section class="board-col">
      <!-- the boards of the open chat (or the repertoire tree and the lesson's boards), ＋ a new board, the list of all -->
      <div class="btabs-top" id="btabs" role="tablist" aria-label="Доски" hidden></div>
      <div class="mat cg-wrap" id="mat-top"></div>
      <div class="board-row">
        <div class="evalbar" id="evalbar" hidden><i id="evalfill"></i><span id="evaltext"></span></div>
        <div class="board-wrap" id="board-wrap"><div id="board"></div></div>
      </div>
      <div class="board-foot">
        <div class="mat cg-wrap" id="mat-bottom"></div>
      </div>
      <!-- move buttons under the board (big on a touch screen); a one-finger swipe on the board does prev/next too.
           The pencil is for touch screens only: a finger draws arrows while it is on (a mouse draws with the right button). -->
      <div class="nav board-nav" id="nav">
        <button type="button" class="icon" data-nav="first" title="В начало (↑)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="5" width="3" height="14" rx="1"/><path d="M19.5 5.5V18.5L9.5 12Z"/></svg></button>
        <button type="button" class="icon" data-nav="prev" title="Назад (←) · свайп вправо по доске"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5.5V18.5L7 12Z"/></svg></button>
        <button type="button" class="icon" data-nav="next" title="Вперёд (→) · свайп влево по доске"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5V18.5L17 12Z"/></svg></button>
        <button type="button" class="icon" data-nav="last" title="В конец (↓)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5V18.5L14.5 12Z"/><rect x="16.5" y="5" width="3" height="14" rx="1"/></svg></button>
        <button type="button" class="icon tool touch-only" id="draw-btn" aria-pressed="false" aria-label="Рисовать стрелки пальцем" title="Рисовать стрелки пальцем"><svg class="line-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></svg></button>
        <button type="button" class="icon tool" id="flip" aria-label="Перевернуть доску" title="Перевернуть доску (F)"><svg class="line-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20V4M3 8l4-4 4 4M17 4v16M13 16l4 4 4-4"/></svg></button>
      </div>
      <div class="meta" id="meta"></div>
    </section>
    <div class="gutter" id="g1" title="Тяни, чтобы поменять ширину · двойной клик — авто"></div>

    <aside class="side">
      <div class="preview" id="preview" hidden></div>
      <div class="side-body" id="panel"></div>
    </aside>

  </main>
</div>

<div class="hoverboard" id="hoverboard" hidden><div id="hb"></div></div>
<!-- menus: the same look everywhere; a tree move's menu opens by right click, a long press or its ⋯ -->
<div class="menu ctx" id="ctx" role="menu" hidden></div>
<div class="menu" id="pmenu" role="menu" hidden></div>
<div class="menu" id="app-menu" role="menu" hidden></div>
<div class="menu" id="model-pop" hidden></div>
<div class="pop" id="jobs-pop" hidden></div>
<!-- «Настройки» (header ⋯): the Lichess login, the jobs over the user's games, Claude, the keys -->
<div class="sheet-back" id="settings" hidden><section class="sheet" role="dialog" aria-modal="true" aria-label="Настройки" id="settings-sheet"></section></div>
<div class="pop" id="chats-pop" hidden></div>
<script type="module" src="/static/app.js?v=40"></script>
</body>
</html>
