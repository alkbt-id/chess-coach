<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- iPad (coach/lan.py): opened from the Home Screen as an app, without Safari's bar. The page runs under the
     status bar (black-translucent + viewport-fit=cover) and pads its header by env(safe-area-inset-top):
     otherwise iPadOS 26+ lays a frosted band over the top of the app and the header under it looks blurred.
     iOS reads the status-bar style when the icon is added: after changing it, re-add the icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/favicon.png">
<title>Шахматный тренер</title>
<link rel="stylesheet" href="/static/vendor/chessground.base.css">
<link rel="stylesheet" href="/static/vendor/board.lichess-brown.css">
<link rel="stylesheet" href="/static/vendor/pieces.merida.css">
<!-- ?v=: the iPad keeps static files cached; bump it (here and on app.js below) when app.css or app.js changes -->
<link rel="stylesheet" href="/static/app.css?v=24">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="modes" role="tablist" aria-label="Режим">
      <button type="button" class="mode" role="tab" data-mode="study" aria-selected="false">Разбор <small id="scene-count"></small></button>
      <button type="button" class="mode" role="tab" data-mode="rep" aria-selected="false" title="Мой дебютный репертуар: разделы, уроки с Claude, тренировка по памяти">Репертуар <small id="rep-count"></small></button>
      <button type="button" class="mode" role="tab" data-mode="puzzle" aria-selected="false">Задачи <small id="due-count"></small></button>
      <button type="button" class="mode" role="tab" data-mode="play" aria-selected="false" title="Партии на Lichess">Игра <small id="play-count"></small></button>
    </div>
    <div class="top-right">
      <div class="status" id="status" aria-live="polite"></div>
      <button type="button" class="job-chip" id="job-chip" title="Обработка партий и задач">⚙︎ <span id="job-text">Обработка</span></button>
      <button type="button" class="icon wide" id="chat-toggle" title="Показать или скрыть чат">Чат с Claude</button>
    </div>
  </header>

  <main class="layout" id="layout">
    <aside class="chat" id="chat">
      <div class="chat-tabs" id="chat-tabs"></div>
      <div class="chat-opts" id="chat-opts">
        <select id="chat-model" title="Модель"></select>
        <select id="chat-effort" title="Усилие (effort): сколько Claude думает"></select>
        <button type="button" class="link-btn" id="chat-del" title="Удалить этот чат">удалить чат</button>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <form class="chat-input" id="chat-form">
        <textarea id="chat-text" rows="1" placeholder="Спроси Claude про позицию, партию или задачу…"></textarea>
        <button class="btn primary" id="chat-send" type="submit">Отправить</button>
      </form>
    </aside>
    <div class="gutter" id="g2" title="Тяни, чтобы поменять ширину · двойной клик — авто"></div>
    <section class="board-col">
      <div class="mat cg-wrap" id="mat-top"></div>
      <div class="board-row">
        <div class="evalbar" id="evalbar" hidden><i id="evalfill"></i><span id="evaltext"></span></div>
        <div class="board-wrap" id="board-wrap"><div id="board"></div></div>
      </div>
      <div class="board-foot">
        <div class="mat cg-wrap" id="mat-bottom"></div>
        <button type="button" class="icon flip-btn" id="flip" title="Перевернуть доску (F)">⇅ Перевернуть</button>
      </div>
      <!-- move buttons under the board (big on a touch screen); a one-finger swipe on the board does prev/next too -->
      <div class="nav board-nav" id="nav">
        <button type="button" class="icon" data-nav="first" title="В начало (↑)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="5" width="3" height="14" rx="1"/><path d="M19.5 5.5V18.5L9.5 12Z"/></svg></button>
        <button type="button" class="icon" data-nav="prev" title="Назад (←) · свайп вправо по доске"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5.5V18.5L7 12Z"/></svg></button>
        <button type="button" class="icon" data-nav="next" title="Вперёд (→) · свайп влево по доске"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5V18.5L17 12Z"/></svg></button>
        <button type="button" class="icon" data-nav="last" title="В конец (↓)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5V18.5L14.5 12Z"/><rect x="16.5" y="5" width="3" height="14" rx="1"/></svg></button>
      </div>
      <div class="meta" id="meta"></div>
    </section>
    <div class="gutter" id="g1" title="Тяни, чтобы поменять ширину · двойной клик — авто"></div>

    <aside class="side">
      <div class="preview" id="preview" hidden></div>
      <div class="side-body" id="panel"></div>
      <div class="side-foot" id="foot">
        <div class="foot-right">
          <label class="switch" id="ask-switch" title="В диаграммах Claude и в позициях из задач твой ход = просьба к Claude посчитать вариант. На своей доске — кнопкой под деревом."><input type="checkbox" id="auto-ask"><span>Claude разбирает мои ходы</span></label>
          <label class="switch" id="engine-switch" title="Stockfish (L)"><input type="checkbox" id="engine-on"><span>Stockfish</span></label>
        </div>
      </div>
    </aside>

  </main>
</div>

<div class="hoverboard" id="hoverboard" hidden><div id="hb"></div></div>
<div class="ctx" id="ctx" hidden></div>
<div class="pop" id="jobs-pop" hidden></div>
<div class="pop" id="chats-pop" hidden></div>
<script type="module" src="/static/app.js?v=28"></script>
</body>
</html>
