# Настройки «Шахматного тренера». Скопируй этот файл в ~/Library/Application Support/ChessCoach/config.toml
# и заполни нужное.
# Все строки необязательны: пустое значение — поведение по умолчанию.

# Ник на Lichess, чьи партии скачивать и разбирать.
# Пусто — берётся аккаунт, которым ты вошёл в Lichess в приложении (вкладка «Игра»).
lichess_user = ""

# Путь к Stockfish. Пусто — ищется в PATH, в /opt/homebrew/bin и /usr/local/bin.
stockfish = ""

# Путь к lc0 — на нём работает Maia, которая оценивает трудность задач. Пусто — ищется там же, где Stockfish.
lc0 = ""

# Пара слов о себе для Claude в чате, например: "решаю тактику в задачах, но не вижу её в партиях".
about = ""
